name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hf-network-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/radar-upstream-hf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public Hugging Face endpoints without database access
        run: |
          python - <<'PY'
          import socket
          import urllib.request
          from radar.platform.http import HttpClient, _default_resolver

          host = "huggingface.co"
          print("dns", _default_resolver(host), flush=True)
          for kind in ("models", "spaces"):
              url = f"https://{host}/api/{kind}?sort=trendingScore&direction=-1&limit=100"
              for method in ("pinned", "urllib"):
                  for attempt in range(2):
                      try:
                          if method == "pinned":
                              response = HttpClient(allowed_hosts={host}, timeout=10).request("GET", url, headers={"Accept": "application/json", "User-Agent": "new-term-radar-free/0.1"})
                              print(kind, method, attempt, response.status, len(response.body), flush=True)
                          else:
                              with urllib.request.urlopen(urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "new-term-radar-free/0.1"}), timeout=10) as response:
                                  print(kind, method, attempt, response.status, len(response.read()), flush=True)
                      except Exception as exc:
                          cause = exc.__cause__ or exc
                          print(kind, method, attempt, type(exc).__name__, type(cause).__name__, repr(cause), flush=True)
          PY

  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install 'setuptools>=77' wheel -r requirements.txt -r requirements-browser-test.txt mcp
      - if: matrix.python == '3.12'
        run: python -m playwright install chrome
      - if: matrix.python == '3.10'
        run: python -m pytest -q tests --ignore=tests/e2e
      - if: matrix.python == '3.12'
        run: python -m pytest -q tests

  dev-integration:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/free-keyword-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: free-radar-dev
    env:
      RADAR_TEST_DATABASE_URL: ${{ secrets.RADAR_TEST_DATABASE_URL }}
      RADAR_TEST_ALLOWED_HOST: ${{ vars.RADAR_TEST_ALLOWED_HOST }}
      RADAR_TEST_READER_DATABASE_URL: ${{ secrets.RADAR_TEST_READER_DATABASE_URL }}
      RADAR_TEST_WRITER_DATABASE_URL: ${{ secrets.RADAR_TEST_WRITER_DATABASE_URL }}
      RADAR_TEST_SITE_ADMIN_DATABASE_URL: ${{ secrets.RADAR_TEST_SITE_ADMIN_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Verify isolated test connection is configured
        run: |
          : "${RADAR_TEST_DATABASE_URL:?missing test DSN}"
          : "${RADAR_TEST_ALLOWED_HOST:?missing test host}"
          : "${RADAR_TEST_READER_DATABASE_URL:?missing reader DSN}"
          : "${RADAR_TEST_WRITER_DATABASE_URL:?missing writer DSN}"
          : "${RADAR_TEST_SITE_ADMIN_DATABASE_URL:?missing site-admin DSN}"
          python -c 'import os; from radar.platform.db import validate_test_database_url; [validate_test_database_url(os.environ[key], os.environ["RADAR_TEST_ALLOWED_HOST"]) for key in ("RADAR_TEST_DATABASE_URL", "RADAR_TEST_READER_DATABASE_URL", "RADAR_TEST_WRITER_DATABASE_URL", "RADAR_TEST_SITE_ADMIN_DATABASE_URL")]'
      - run: python -m pytest -q tests/platform_integration
