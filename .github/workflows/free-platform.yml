name: Free term signal collection

on:
  schedule:
    - cron: "0 0,8,16 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Collect new terms or competitor Sitemaps in the selected branch environment"
        required: true
        type: choice
        options:
          - sources
          - sites

permissions:
  contents: read

concurrency:
  group: free-radar-${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
  cancel-in-progress: false

jobs:
  collect:
    # Cron is off by default and only runs from main. Manual runs are limited to
    # main and the trusted development branch; each uses its own environment secret.
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && vars.FREE_RADAR_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/free-keyword-platform'))
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'free-radar-production' || 'free-radar-dev' }}
    timeout-minutes: 25
    env:
      KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || github.event.schedule == '30 1 * * *' && 'sites' || 'sources' }}
      RADAR_WRITE_DATABASE_URL: ${{ secrets.RADAR_WRITE_DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free collector dependencies
        run: python -m pip install -r requirements-platform.txt
      - name: Check database secret
        run: test -n "$RADAR_WRITE_DATABASE_URL"
      - name: Collect and store in Neon
        run: |
          if [ "$KIND" = sites ]; then MAX_JOBS=20; else MAX_JOBS=3; fi
          python -m radar collect --kind "$KIND" --max-jobs "$MAX_JOBS"
